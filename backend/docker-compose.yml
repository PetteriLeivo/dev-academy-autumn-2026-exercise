services:
  backend:
    build:
      context: ..                         
      dockerfile: backend/Dockerfile
    container_name: express_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USER: academy
      DB_PASS: academy
      DB_NAME: electricity
    extra_hosts:
      - "host.docker.internal:host-gateway"